[package]
name = "himind-agent"
version = "0.3.55"
edition = "2021"
default-run = "himind-agent"

[features]
mcp-console = []

[[bin]]
name = "himind-agent"
path = "src/main.rs"

[[bin]]
name = "himind-agent-updater"
path = "src/updater.rs"

[[bin]]
name = "himind-agent-launcher"
path = "src/launcher.rs"

[[bin]]
name = "himind-agent-mcp"
path = "src/main.rs"
required-features = ["mcp-console"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2.5"
zip = "0.6"
rfd = "0.15"
raw-window-handle = "0.6"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
url = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
fs4 = "0.13"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
rand = "0.8"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
jsonschema = { version = "0.26", default-features = false }
# ACP 出站客户端走官方 SDK（Zed/agentclientprotocol），协议类型、JSON-RPC 分帧、
# 请求路由与取消原语都由它维护，避免自研报文层与协议演进脱节。
agent-client-protocol = "2.2"
# SDK 的传输/执行原语建立在 futures 之上：出站 Sink、入站 Stream 与 block_on。
futures = "0.3"
# 备份包的口令加密：PBKDF2-HMAC-SHA256 派生密钥 + AES-256-GCM 认证加密。
# 纯 Rust 实现，没有 C 编译依赖；与 DPAPI（只对当前 Windows 用户可解）
# 互补——DPAPI 负责本机落盘，这里负责让凭据能跨机器搬走。
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
