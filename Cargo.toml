[package]
name = "project-dashboard-agent"
version = "0.2.0"
edition = "2021"
default-run = "project-dashboard-agent"

[features]
mcp-console = []

[[bin]]
name = "project-dashboard-agent"
path = "src/main.rs"

[[bin]]
name = "project-dashboard-agent-mcp"
path = "src/main.rs"
required-features = ["mcp-console"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
zip = "0.6"
rfd = "0.15"
raw-window-handle = "0.6"
sha2 = "0.10"
url = "2"
quick-xml = { version = "0.39", features = ["serialize"] }