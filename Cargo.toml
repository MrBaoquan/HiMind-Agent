[package]
name = "himind-agent"
version = "0.3.27"
edition = "2021"
default-run = "himind-agent"

[features]
mcp-console = []

[[bin]]
name = "himind-agent"
path = "src/main.rs"

[[bin]]
name = "himind-agent-updater"
path = "src/updater.rs"

[[bin]]
name = "himind-agent-launcher"
path = "src/launcher.rs"

[[bin]]
name = "himind-agent-mcp"
path = "src/main.rs"
required-features = ["mcp-console"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2.5"
zip = "0.6"
rfd = "0.15"
raw-window-handle = "0.6"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
url = "2"
quick-xml = { version = "0.39", features = ["serialize"] }
fs4 = "0.13"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
rand = "0.8"
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
